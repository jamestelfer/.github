issuer: https://token.actions.githubusercontent.com
subject_pattern: '^repo:jamestelfer(@792299)?/[^:@]+(@[0-9]+)?:environment:release$'
claim_pattern:
  ref: '^refs/tags/v.*$'
  repository: '^jamestelfer/(dollop|relic|sandy|imds-broker|boxed)$'

permissions:
  contents: write

repositories:
  - homebrew-tap
  - nixpkgs
